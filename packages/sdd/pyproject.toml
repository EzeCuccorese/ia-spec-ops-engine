[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cucco-sdd"
version = "0.1.0"
description = "Spec-Driven Development (SDD) AI Governance Engine, FastMCP Server, and Multi-Agent Harness"
authors = [
    { name = "Cucco SpecOps Team", email = "team@cucco-specops.org" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sdd = "sdd_engine.cli:main"
sdd-engine = "sdd_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_engine"]
