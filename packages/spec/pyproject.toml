[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spec"
version = "0.1.0.dev0"
description = "Personal AI-governance, specification, and verification CLI for coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
spec = "spec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spec"]

[tool.pytest.ini_options]
pythonpath = ["src", "../ai-governance/src", "../workspace/src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"workbench/runner/**" = ["E402"]
"tests/test_workbench_harness.py" = ["E402"]
