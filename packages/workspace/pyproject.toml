[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devscripts-workspace"
version = "0.2.0"
description = "Gestor determinista de workspaces, repositorios Git, entornos locales, builds y Kubernetes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_engine"]

[project.scripts]
ws = "workspace_engine.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "../common/src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
