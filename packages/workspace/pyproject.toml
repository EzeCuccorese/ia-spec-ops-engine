[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workspace"
version = "2.0.1"
description = "Deterministic quality gates, design limits, stack detection, and command condensation for coding agents."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18",
    "lizard>=1.25.0",  # first release that parses Dart
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_engine"]

[project.scripts]
ws = "workspace_engine.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
