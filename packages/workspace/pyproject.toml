[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ia-spec-ops-workspace"
version = "0.2.0"
description = "Deterministic workspace manager, Git worktree isolation, local environment orchestrator, builds and Kubernetes manager."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_engine"]

[project.scripts]
ws = "workspace_engine.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
