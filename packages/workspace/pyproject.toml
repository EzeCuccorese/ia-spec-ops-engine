[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workspace"
version = "0.2.0"
description = "Deterministic workspace manager, Git worktree isolation, local environment orchestrator, builds and Kubernetes manager."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9",
    "ruamel.yaml>=0.18",
    "lizard>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_engine"]

[project.scripts]
ws = "workspace_engine.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
