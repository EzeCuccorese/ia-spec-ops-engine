[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devscripts-workspace"
version = "0.1.0"
description = "Gestor determinista de workspaces, repositorios Git, entornos locales, builds y Kubernetes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_engine"]

[project.scripts]
create-worktree = "workspace_engine.cli.create_worktree:main"
generate-workspace = "workspace_engine.cli.generate_workspace:main"
edit-workspace = "workspace_engine.cli.edit_workspace:main"
clean-workspace = "workspace_engine.cli.clean_workspace:main"
stop-workspace = "workspace_engine.cli.stop_workspace:main"
reset-repos = "workspace_engine.cli.reset_repos:main"
delete-workspaces = "workspace_engine.cli.delete_workspaces:main"
kube-env = "workspace_engine.cli.kube_env:main"
build-project = "workspace_engine.cli.build_project:main"
install-deps = "workspace_engine.cli.install_deps:main"
set-java = "workspace_engine.cli.set_java:main"
load-env = "workspace_engine.cli.load_env:main"
init-env = "workspace_engine.cli.init_env:main"
unit-test-benchmark = "workspace_engine.cli.unit_test_benchmark:main"
run-local = "workspace_engine.run_local.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
