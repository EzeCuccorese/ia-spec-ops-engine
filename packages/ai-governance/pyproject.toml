[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "specops-ai-governance"
version = "0.1.0"
description = "AI Governance — Engineering Standards, Token Frugality, Telemetry, Ritmo Pacing & Light Session Management."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.9",
]

[project.scripts]
specops = "ai_governance.cli:main"
governance = "ai_governance.cli:main"
rules = "ai_governance.rules.cli:main"
frugal = "ai_governance.frugality.cli:main"
statusline = "ai_governance.telemetry.statusline:main"
telemetry = "ai_governance.telemetry.cli:main"
progress = "ai_governance.session.cli:main"
progreso = "ai_governance.session.cli:main"
jira = "ai_governance.tools.jira:main"
confluence = "ai_governance.tools.confluence:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
