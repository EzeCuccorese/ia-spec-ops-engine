[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-governance"
version = "0.1.0"
description = "AI Governance — per-agent engineering standards, token frugality, telemetry and lightweight task tracking."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marklas==0.8.6",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.9",
]

[project.scripts]
ai-governance = "ai_governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
