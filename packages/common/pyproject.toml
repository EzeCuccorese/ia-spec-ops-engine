[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cucco-common"
version = "0.1.0"
description = "Shared base utilities, typing, deterministic subprocess wrappers, and project parsers for Cucco SpecOps Engine."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devscripts_common"]
