name: Notify Release to Google Chat

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la versión a notificar (ej: v1.2.3)"
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send notification to Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, re

          def sanitize(text):
              if not text:
                  return ""
              text = re.sub(r'^#{1,6}\s+(.+)$', r'*\1*', text, flags=re.MULTILINE)
              text = re.sub(r'\[([^\]]+)\]\([^\)]+\)', r'\1', text)
              text = re.sub(r'<[^>]+>', '', text)
              text = re.sub(r'\n{3,}', '\n\n', text)
              return text.strip()

          is_manual = os.environ.get('IS_MANUAL', 'false') == 'true'

          if is_manual:
              tag   = os.environ['TAG']
              repo  = os.environ['REPO']
              token = os.environ['GH_TOKEN']
              api_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
              req = urllib.request.Request(api_url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              })
              try:
                  with urllib.request.urlopen(req) as r:
                      release = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"::error::Release not found for tag '{tag}'. Make sure the tag exists and has a published GitHub release (e.g. 'v1.3.0' not '1.3.0').")
                      raise SystemExit(1)
                  raise
              body = sanitize(release.get('body', ''))
              url  = release.get('html_url', '')
          else:
              tag  = os.environ.get('TAG', '')
              body = sanitize(os.environ.get('BODY', ''))
              url  = os.environ.get('URL', '')
          # Strip leading version header added by release-please (e.g. "## [1.2.0](...) (date)")
          body = re.sub(r'^\*[^\n]+\*\n+', '', body)

          message = f"🚀 *Nueva versión de Workspace IA Toolkit!*\n📋 {tag}\n\n{body}\n\n🔗 {url}\n\n⚙️ *Para actualizar:*\n1. En el repo `workspace-ia-toolkit`: `./update-toolkit.sh`\n2. En cada workspace: `./sync-toolkit.sh`"

          payload = json.dumps({"text": message}).encode("utf-8")
          req = urllib.request.Request(
              os.environ['WEBHOOK_URL'],
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"}
          )
          urllib.request.urlopen(req)
          EOF
