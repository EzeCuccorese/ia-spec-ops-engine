name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use a PAT (not GITHUB_TOKEN): pushes/releases by GITHUB_TOKEN do
          # not trigger workflows, so release PRs never ran CI (required checks
          # never reported → unmergeable). A real-identity token makes the
          # release-PR branch trigger CI and the published release trigger
          # notify-release.yml natively on `release: published`.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Reads release-please-config.json and .release-please-manifest.json
          # from the repo root by default.
