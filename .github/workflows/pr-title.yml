name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit with scope
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|chore|ci)\([^)]+\)!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "❌ PR title must follow Conventional Commits with a scope."
            echo "   Format: type(scope): description"
            echo "   Types:  feat, fix, perf, refactor, docs, test, chore, ci"
            echo "   Got:    $TITLE"
            exit 1
          fi
