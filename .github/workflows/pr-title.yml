name: PR Title (Conventional Commits)

# With squash merges the PR title becomes the commit on main, and the release
# version is computed from that commit. This check keeps the titles parseable.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "Title must look like 'feat(scope): summary' (see scripts/release.py)."
            echo "Got: $TITLE"
            exit 1
          fi
