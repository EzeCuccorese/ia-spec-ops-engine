name: Publish Release

# Runs when a release PR is merged: tags the merge commit and publishes the
# GitHub Release with the changelog section as its notes.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to republish." >&2
            exit 1
          fi
          python3 scripts/release.py notes "$version" > notes.md
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
