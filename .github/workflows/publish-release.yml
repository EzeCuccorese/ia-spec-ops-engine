name: Publish Release

# Runs when a release PR is merged: tags the merge commit and publishes the
# GitHub Release with the changelog section as its notes.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-run by hand for an already merged release PR (for example after a failed run).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_ID: ${{ vars.APP_ID }}
        run: |
          set -euo pipefail
          python3 scripts/check_private_packs.py HEAD
          version="$(cat VERSION)"
          tag="v$version"
          head_sha="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "Tag $tag already exists on origin pointing to $tag_sha (expected $head_sha); refusing to republish." >&2
              exit 1
            fi
            echo "Tag $tag already exists at $head_sha; continuing to release publication."
          else
            git config user.name "ia-spec-ops-release[bot]"
            git config user.email "${APP_ID}+ia-spec-ops-release[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
          python3 scripts/release.py notes "$version" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation."
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          fi
