name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@devscripts.org"

      - name: Install uv & Dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[dev]"
          uv pip install --system -e "packages/common[dev]"
          uv pip install --system -e "packages/workspace[dev]"
          uv pip install --system -e "packages/sdd[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check packages/ rules/

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=devscripts_common --cov=workspace_engine --cov=sdd_engine --cov-report=term-missing
