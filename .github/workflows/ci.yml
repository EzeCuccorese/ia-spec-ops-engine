name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop, "codex/**", "feature/**", "feat/**" ]
  pull_request:
    branches: [ main, master, develop, "feat/**" ]

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.11"

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.org"

      - name: Install Dependencies
        run: |
          uv sync --all-packages

      - name: Run Ruff Lint
        run: |
          uv run ruff check packages/ tests/

      - name: Run Ruff Format Check
        run: |
          uv run ruff format --check packages/ tests/

      - name: Run Mypy
        run: |
          uv run mypy

      - name: Run Pytest Suite with Coverage
        run: |
          uv run python -m pytest -v --cov=ai_governance --cov=spec --cov=workspace_engine --cov-report=term-missing \
            packages/ai-governance/tests \
            packages/spec/tests \
            packages/workspace/tests \
            packages/workspace/tests_integration \
            tests

      - name: Verify CLI Tools & Diagnostics
        run: |
          uv run specops --help
          uv run governance --help
          uv run ws --help
          uv run spec --help

      - name: Build Monorepo Wheels
        run: |
          uv build packages/ai-governance --wheel --out-dir dist
          uv build packages/spec --wheel --out-dir dist
          uv build packages/workspace --wheel --out-dir dist

      - name: Verify Wheel Hermeticity & CLI in Isolated Environment
        run: |
          uv run python tests/integration/verify_wheels.py dist
