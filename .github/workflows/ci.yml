name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.11"

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.org"

      - name: Install Dependencies
        run: |
          uv sync --all-packages

      - name: Run Ruff Lint
        run: |
          uv run ruff check packages/ tests/

      - name: Run Ruff Format Check
        run: |
          uv run ruff format --check packages/ tests/

      - name: Run Mypy
        run: |
          uv run mypy

      - name: Run Pytest Suite with Coverage
        run: |
          uv run python -m pytest -q --cov --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            packages/ai-governance/tests \
            packages/spec/tests \
            packages/workspace/tests \
            packages/workspace/tests_integration \
            tests

      # Coverage may not drop against the target branch; there is no fixed floor,
      # so nobody writes filler tests to reach a number.
      - name: Coverage must not drop vs target branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          (cd ../base && uv sync --all-packages -q && uv run python -m pytest -q -p no:cacheprovider \
            --cov --cov-report=json:../base-coverage.json \
            packages/ai-governance/tests packages/spec/tests packages/workspace/tests \
            packages/workspace/tests_integration tests > /dev/null)
          python3 - <<'PY'
          import json
          head = json.load(open("coverage.json"))["totals"]["percent_covered"]
          base = json.load(open("../base-coverage.json"))["totals"]["percent_covered"]
          print(f"coverage: target {base:.2f}% -> this PR {head:.2f}%")
          raise SystemExit(1 if head < base - 0.05 else 0)
          PY

      - name: Verify CLI Tools & Diagnostics
        run: |
          uv run ai-governance --help
          uv run ws --help
          uv run spec --help

      - name: Build Monorepo Wheels
        run: |
          uv build packages/ai-governance --wheel --out-dir dist
          uv build packages/spec --wheel --out-dir dist
          uv build packages/workspace --wheel --out-dir dist

      - name: Verify Wheel Hermeticity & CLI in Isolated Environment
        run: |
          uv run python tests/integration/verify_wheels.py dist
