name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop, "codex/**", "feature/**", "feat/**" ]
  pull_request:
    branches: [ main, master, develop, "feat/**" ]

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.org"

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]" -e ./packages/ai-governance -e ./packages/spec -e ./packages/workspace

      - name: Run Ruff Lint
        run: |
          uv run --with ruff ruff check packages/ tests_acceptance/

      - name: Run Ruff Format Check
        run: |
          uv run --with ruff ruff format --check packages/ tests_acceptance/

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest -v --cov=ai_governance --cov=spec --cov=workspace_engine --cov-report=term-missing packages/ tests_acceptance/

      - name: Verify CLI Tools & Diagnostics
        run: |
          uv run specops doctor
          uv run spec doctor
          uv run ws doctor
          uv run ws hooks status

      - name: Build Monorepo Wheels
        run: |
          uv build packages/ai-governance
          uv build packages/spec
          uv build packages/workspace
          uv build

      - name: Verify Wheel Hermeticity & CLI in Isolated Environment
        run: |
          python -m venv /tmp/isolated_wheel_env
          /tmp/isolated_wheel_env/bin/pip install dist/*.whl packages/*/dist/*.whl
          /tmp/isolated_wheel_env/bin/specops --help
          /tmp/isolated_wheel_env/bin/spec --help
          /tmp/isolated_wheel_env/bin/ws --help
          rm -rf /tmp/isolated_wheel_env


