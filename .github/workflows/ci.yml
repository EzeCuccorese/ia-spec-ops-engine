name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop, codex/**, feature/** ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.org"

      - name: Install Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          uv run --with ruff ruff check packages/

      - name: Run Ruff Format Check
        run: |
          uv run --with ruff ruff format --check packages/

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest -v --cov=rules --cov=spec --cov=workspace_engine --cov-report=term-missing

      - name: Verify CLI Tools & Diagnostics
        run: |
          uv run ws doctor
          uv run ws hooks status


