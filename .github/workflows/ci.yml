name: CI Quality Gate

on:
  push:
    branches: [ main, master, develop, "codex/**", "feature/**", "feat/**" ]
  pull_request:
    branches: [ main, master, develop, "feat/**" ]

jobs:
  test:
    name: Run Pytest Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Git config
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci@example.org"

      - name: Install Dependencies
        run: |
          ./install.sh

      - name: Run Ruff Lint
        run: |
          .venv/bin/ruff check packages/ tests_acceptance/ scripts/

      - name: Run Ruff Format Check
        run: |
          .venv/bin/ruff format --check packages/ tests_acceptance/ scripts/

      - name: Run Pytest Suite with Coverage
        run: |
          .venv/bin/python -m pytest -v --cov=ai_governance --cov=spec --cov=workspace_engine --cov-report=term-missing packages/ tests_acceptance/

      - name: Verify CLI Tools & Diagnostics
        run: |
          .venv/bin/specops --help
          .venv/bin/spec --help
          .venv/bin/ws --help

      - name: Build Monorepo Wheels
        run: |
          uv build packages/ai-governance --wheel --out-dir dist
          uv build packages/spec --wheel --out-dir dist
          uv build packages/workspace --wheel --out-dir dist

      - name: Verify Wheel Hermeticity & CLI in Isolated Environment
        run: |
          .venv/bin/python scripts/verify_wheels.py dist

