[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "specops-engine"
version = "0.4.0"
description = "SpecOps Engine — Decoupled Monorepo for AI Governance & Spec-Driven Development (spec) and Workspace DevOps Tools (ws)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/ai-governance/src/ai_governance",
    "packages/spec/src/spec",
    "packages/workspace/src/workspace_engine",
]

[project.scripts]
governance = "ai_governance.cli:main"
rules = "ai_governance.rules.cli:main"
frugal = "ai_governance.frugality.cli:main"
statusline = "ai_governance.telemetry.statusline:main"
progress = "ai_governance.session.cli:main"
progreso = "ai_governance.session.cli:main"
jira = "ai_governance.tools.jira:main"
confluence = "ai_governance.tools.confluence:main"
spec = "spec.cli:main"
ws = "workspace_engine.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/spec/workbench/runner/**" = ["E402"]
"packages/spec/tests/test_workbench_harness.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["packages/ai-governance/src", "packages/spec/src", "packages/workspace/src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["packages/ai-governance/tests", "packages/spec/tests", "packages/workspace/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end integration tests",
]
norecursedirs = ["node_modules", ".venv", "venv", ".git", ".pytest_cache", ".claude", ".spec", ".specops"]
