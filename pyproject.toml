# ia-spec-ops-engine: uv workspace root. Not a distributable package itself.
#
#   uv sync --all-packages        # create .venv with the three packages + dev tools
#   uv run pytest                 # run the whole suite
#   uv pip install -e packages/<pkg>   # install a single package elsewhere
[project]
name = "ia-spec-ops-engine"
version = "0.0.0"
description = "Workspace root for ai-governance, spec and workspace packages."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/corporate-rules"]

[tool.uv.sources]
ai-governance = { workspace = true }
spec = { workspace = true }
workspace = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.9",
    "mypy>=1.10",
    "types-psutil",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages/ai-governance/src:packages/spec/src:packages/workspace/src"
packages = ["ai_governance", "spec", "workspace_engine"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["packages/ai-governance/src", "packages/spec/src", "packages/workspace/src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]

[tool.pytest.ini_options]
pythonpath = ["packages/ai-governance/src", "packages/spec/src", "packages/workspace/src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["packages/ai-governance/tests", "packages/spec/tests", "packages/workspace/tests", "packages/workspace/tests_integration", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end integration tests",
]
norecursedirs = ["node_modules", ".venv", "venv", ".git", ".pytest_cache", ".claude"]
