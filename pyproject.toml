[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devscripts-monorepo"
version = "0.2.0"
description = "Monorepo de automatización y orquestación de desarrollo: devscripts_common, workspace_engine y sdd_engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.17.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["packages/common/src", "packages/workspace/src", "packages/sdd/src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["packages/common/tests", "packages/workspace/tests", "packages/sdd/tests", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end integration tests",
]
norecursedirs = ["node_modules", ".venv", "venv", ".git", ".pytest_cache", ".claude"]

[project.scripts]
# SDD Engine (Full IA & Gobernanza)
sdd = "sdd_engine.cli:main"
sdd-engine = "sdd_engine.cli:main"

# Workspace Engine (100% Determinista, cero IA — CLI Unificado)
ws = "workspace_engine.cli.main:main"
