[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devscripts"
version = "0.1.0"
description = "Herramienta unificada de automatización para desarrollo y orquestación de workspaces de IA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["devscripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests/unit", "tests/integration", "docker"]
addopts = "-ra --strict-markers --import-mode=importlib"
norecursedirs = ["node_modules", ".venv", "venv", ".git", ".pytest_cache", ".claude"]


[project.scripts]
create-worktree = "devscripts.cli.workspace.create_worktree:main"
delete-workspaces = "devscripts.cli.workspace.delete_workspaces:main"
edit-workspace = "devscripts.cli.workspace.edit_workspace:main"
generate-workspace = "devscripts.cli.workspace.generate_workspace:main"
sync-toolkit = "devscripts.cli.toolkit.sync_toolkit:main"
toolkit-menu = "devscripts.cli.toolkit.toolkit_menu:main"
update-toolkit = "devscripts.cli.toolkit.update_toolkit:main"
init-env = "devscripts.cli.environment.init_env:main"
clean-workspace = "devscripts.cli.workspace.clean_workspace:main"
stop-workspace = "devscripts.cli.workspace.stop_workspace:main"
reset-repos = "devscripts.cli.workspace.reset_repos:main"
install-deps = "devscripts.cli.environment.install_deps:main"
aws-logout = "devscripts.cli.cloud_net.aws_logout:main"
setup-vpn-routing = "devscripts.cli.cloud_net.setup_vpn_routing:main"
unit-test-benchmark = "devscripts.cli.environment.unit_test_benchmark:main"
agent-sandbox = "devscripts.cli.environment.agent_sandbox:main"
anonymize-repo = "devscripts.cli.workspace.anonymize_repo:main"
sdd = "devscripts.cli.sdd.sdd:main"
devscripts-dashboard = "devscripts.cli.toolkit.dashboard:main"
kube-env = "devscripts.cli.cloud_net.kube_env:main"
load-env = "devscripts.cli.environment.load_env:main"
run-local = "devscripts.cli.environment.run_local:main"
set-java = "devscripts.cli.environment.set_java:main"
toggle-vpn = "devscripts.cli.cloud_net.toggle_vpn:main"
build-project = "devscripts.cli.environment.build_project:main"

