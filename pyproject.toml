[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cucco-specops-engine"
version = "0.3.0"
description = "Cucco SpecOps Engine — Multi-Agent AI Governance Harness, Deterministic Workspace Engine, SDD Lifecycle Manager & Modular Rules Catalog"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.17.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/common/src/devscripts_common",
    "packages/sdd/src/sdd_engine",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E402", "F401", "F841", "E501", "E722", "I001"]

[tool.pytest.ini_options]
pythonpath = ["packages/common/src", "packages/sdd/src", "."]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["packages/common/tests", "packages/sdd/tests", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end integration tests",
]
norecursedirs = ["node_modules", ".venv", "venv", ".git", ".pytest_cache", ".claude"]

[project.scripts]
# SDD Engine (Full IA & Gobernanza)
sdd = "sdd_engine.cli:main"
sdd-engine = "sdd_engine.cli:main"
